<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    :root {
      --bg:        #080b10;
      --bg1:       #0e1219;
      --bg2:       #141a24;
      --surface:   #1a2130;
      --surface2:  #202838;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.12);
      --text:      #e8edf5;
      --muted:     rgba(232,237,245,0.55);
      --muted2:    rgba(232,237,245,0.32);
      --green:     #3ddc6e;
      --green-dim: rgba(61,220,110,0.18);
      --red:       #f05454;
      --red-dim:   rgba(240,84,84,0.18);
      --gold:      #f0c040;
      --radius:    12px;
      --mono:      'Courier New', Courier, monospace;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 900px 420px at 65% -8%,  rgba(61,220,110,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 500px 300px at 5% 85%,   rgba(50,80,220,0.05) 0%, transparent 60%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 24px 16px 52px;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── HEADER ──────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #28a84e 0%, #3ddc6e 100%);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.45rem;
      box-shadow: 0 0 22px rgba(61,220,110,0.25), 0 4px 14px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
      line-height: 1;
    }

    .brand-text p {
      font-size: 0.76rem;
      color: var(--muted2);
      margin-top: 5px;
    }

    /* ── SCORE HUD ───────────────────────────── */
    .hud { display: flex; gap: 8px; }

    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 20px;
      text-align: center;
      min-width: 88px;
    }

    .hud-label {
      font-size: 0.62rem;
      color: var(--muted2);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-family: var(--mono);
    }

    .hud-value {
      font-family: var(--mono);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1.2;
      margin-top: 2px;
      text-shadow: 0 0 14px rgba(61,220,110,0.3);
    }

    /* ── MAIN GRID ───────────────────────────── */
    .content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (min-width: 820px) {
      .content { grid-template-columns: auto 1fr; }
    }

    /* ── GAME COLUMN ─────────────────────────── */
    .game-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* ── CANVAS WRAPPER ──────────────────────── */
    .canvas-wrap {
      position: relative;
      width:  min(92vw, 400px);
      height: min(92vw, 400px);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(61,220,110,0.16);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 20px 60px rgba(0,0,0,0.5);
      background: #090d13;
      flex-shrink: 0;
    }

    canvas {
      display: block;
      width: 100%; height: 100%;
      background: #090d13;
    }

    /* ── START OVERLAY (inside canvas only) ──── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px;
      background: rgba(8,11,16,0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay-snake-icon {
      font-size: 3.2rem;
      animation: bob 2.8s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(61,220,110,0.4));
    }

    @keyframes bob {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-7px) rotate(3deg); }
    }

    .overlay h2 {
      font-family: var(--mono);
      font-size: 1.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: 0 0 22px rgba(61,220,110,0.4);
    }

    .overlay p {
      color: var(--muted);
      font-size: 0.86rem;
      text-align: center;
      line-height: 1.6;
      max-width: 24ch;
    }

    .btn-start {
      appearance: none;
      background: linear-gradient(135deg, #28a84e, #3ddc6e);
      color: #031a0b;
      border: none;
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px 30px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(61,220,110,0.28);
      transition: transform 0.12s ease, filter 0.14s ease;
    }

    .btn-start:hover  { transform: translateY(-2px); filter: brightness(1.08); }
    .btn-start:active { transform: scale(0.97); }

    /* ── GAME OVER CARD (below canvas, no overlap) */
    .gameover-card {
      width: min(92vw, 400px);
      background: var(--surface);
      border: 1px solid var(--border2);
      border-top: 2.5px solid var(--red);
      border-radius: var(--radius);
      box-shadow: 0 8px 36px rgba(0,0,0,0.45), 0 0 0 1px rgba(240,84,84,0.07);
      overflow: hidden;

      /* hidden by default */
      display: none;
      flex-direction: column;
    }

    .gameover-card.show {
      display: flex;
      animation: revealCard 0.28s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    @keyframes revealCard {
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .gameover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: rgba(240,84,84,0.07);
      border-bottom: 1px solid rgba(240,84,84,0.12);
    }

    .go-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .go-score-badge {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 4px 12px;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .go-score-badge strong {
      color: var(--green);
      font-size: 1rem;
    }

    .gameover-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── INPUT GROUP ─────────────────────────── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .field-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      pointer-events: none;
      color: var(--muted2);
      transition: color 0.15s;
      line-height: 1;
    }

    #player-name {
      display: block;
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--bg1);
      border: 1.5px solid var(--border2);
      border-radius: 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.17s ease, box-shadow 0.17s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    #player-name::placeholder { color: var(--muted2); font-weight: 400; }

    #player-name:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(61,220,110,0.13);
    }

    .field-wrap:focus-within .field-icon { color: var(--green); }

    /* ── STATUS ──────────────────────────────── */
    #submit-status {
      min-height: 22px;
      font-size: 0.83rem;
      text-align: center;
      border-radius: 8px;
      padding: 0;
      transition: all 0.18s ease;
    }

    #submit-status.ok {
      padding: 7px 12px;
      background: rgba(61,220,110,0.1);
      border: 1px solid rgba(61,220,110,0.22);
      color: var(--green);
    }

    #submit-status.err {
      padding: 7px 12px;
      background: rgba(240,84,84,0.1);
      border: 1px solid rgba(240,84,84,0.22);
      color: var(--red);
    }

    /* ── BUTTONS ─────────────────────────────── */
    .btn-row { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 11px 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.11s ease, filter 0.14s ease;
      white-space: nowrap;
    }

    .btn:hover  { transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; transform: none !important; filter: none !important; }

    .btn-green {
      background: linear-gradient(135deg, #28a84e, #3ddc6e);
      color: #031a0b;
      border-color: rgba(255,255,255,0.06);
      box-shadow: 0 4px 16px rgba(61,220,110,0.22);
    }

    .btn-green:hover { filter: brightness(1.07); }

    .btn-outline {
      background: transparent;
      color: var(--muted);
      border-color: var(--border2);
    }

    .btn-outline:hover { background: var(--surface2); color: var(--text); }

    /* ── CONTROLS ────────────────────────────── */
    .key-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .key-group { display: flex; align-items: center; gap: 4px; font-size: 0.74rem; color: var(--muted2); }

    kbd {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-bottom: 2px solid rgba(0,0,0,0.4);
      border-radius: 5px;
      padding: 2px 7px;
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--muted);
    }

    .key-sep { color: var(--muted2); font-size: 0.68rem; }

    /* ── LEADERBOARD ─────────────────────────── */
    .lb-panel {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.28);
    }

    .lb-header {
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }

    .lb-title {
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .refresh-btn {
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--muted2);
      font-size: 0.78rem;
      padding: 5px 11px;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: background 0.14s, color 0.14s, transform 0.11s;
      font-family: inherit;
    }

    .refresh-btn:hover { background: var(--surface2); color: var(--text); transform: translateY(-1px); }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 9px 16px;
      font-size: 0.63rem;
      font-family: var(--mono);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted2);
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-weight: 400;
    }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover td   { background: rgba(61,220,110,0.04); }

    tbody td {
      padding: 11px 16px;
      font-size: 0.89rem;
      vertical-align: middle;
    }

    .rank-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 7px;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--surface2);
      color: var(--muted2);
    }

    .rank-1 .rank-chip { background: rgba(240,192,64,0.14); color: var(--gold);  border: 1px solid rgba(240,192,64,0.28); }
    .rank-2 .rank-chip { background: rgba(170,184,195,0.12); color: #b0bec5;     border: 1px solid rgba(170,184,195,0.25); }
    .rank-3 .rank-chip { background: rgba(175,95,65,0.13);   color: #c49080;     border: 1px solid rgba(175,95,65,0.25); }

    .name-col  { color: var(--text); font-weight: 500; }
    .score-col { text-align:right; font-family:var(--mono); font-weight:700; color:var(--green); }
    .date-col  { text-align:right; font-size:0.74rem; color:var(--muted2); font-family:var(--mono); }

    .lb-msg {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted2);
      font-size: 0.87rem;
      line-height: 1.65;
    }

    .lb-msg-icon { font-size: 1.9rem; display:block; margin-bottom:8px; opacity:0.45; }
    .lb-msg.err  { color: rgba(240,84,84,0.7); }

    /* ── FOOTER ──────────────────────────────── */
    footer {
      text-align: center;
      font-size: 0.73rem;
      color: var(--muted2);
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">🐍</div>
      <div class="brand-text">
        <h1>SNAKE GAME</h1>
        <p>Eat · Grow · Survive</p>
      </div>
    </div>
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">Score</div>
        <div class="hud-value" id="score-display">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Best</div>
        <div class="hud-value" id="best-display">0</div>
      </div>
    </div>
  </header>

  <!-- CONTENT GRID -->
  <main class="content">

    <!-- LEFT COLUMN: canvas + game-over card + controls -->
    <div class="game-col">

      <!-- Canvas with start overlay inside it -->
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Start screen overlay (inside canvas — fine, no input fields here) -->
        <div id="start-overlay" class="overlay">
          <div class="overlay-snake-icon">🐍</div>
          <h2>Snake</h2>
          <p>Classic arcade gameplay. Eat food, grow longer, don't crash.</p>
          <button class="btn-start" onclick="startGame()">▶ Start Game</button>
        </div>
      </div>

      <!-- Game Over card — sits BELOW the canvas, fully separate, zero overlap -->
      <div id="gameover-card" class="gameover-card">
        <div class="gameover-header">
          <div class="go-title">
            <span>💀</span> Game Over
          </div>
          <div class="go-score-badge">
            Score: <strong id="final-score-val">0</strong>
          </div>
        </div>
        <div class="gameover-body">

          <!-- Name input — properly labelled and styled -->
          <div class="field">
            <label class="field-label" for="player-name">Your Name</label>
            <div class="field-wrap">
              <span class="field-icon" aria-hidden="true">👤</span>
              <input
                type="text"
                id="player-name"
                placeholder="Type your name and press Enter…"
                maxlength="20"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
          </div>

          <!-- Status message -->
          <div id="submit-status"></div>

          <!-- Action buttons -->
          <div class="btn-row">
            <button class="btn btn-green" id="submit-btn" onclick="submitScore()">
              💾 Submit Score
            </button>
            <button class="btn btn-outline" onclick="startGame()">
              ↺ Play Again
            </button>
          </div>

        </div>
      </div>

      <!-- Keyboard hints -->
      <div class="key-row">
        <div class="key-group">
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
          <span>move</span>
        </div>
        <span class="key-sep">·</span>
        <div class="key-group">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          <span>move</span>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: leaderboard -->
    <aside class="lb-panel">
      <div class="lb-header">
        <div class="lb-title">🏆 Leaderboard</div>
        <button class="refresh-btn" onclick="fetchLeaderboard()">↻ Refresh</button>
      </div>
      <table id="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th style="text-align:right">Score</th>
            <th style="text-align:right">Date</th>
          </tr>
        </thead>
        <tbody id="lb-body">
          <tr><td colspan="4">
            <div class="lb-msg">
              <span class="lb-msg-icon">⏳</span>
              Loading scores…
            </div>
          </td></tr>
        </tbody>
      </table>
    </aside>

  </main>

  <footer>
    Snake Game &nbsp;·&nbsp; Docker &amp; Kubernetes Assignment
  </footer>

</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  const API_BASE    = 'http://localhost:5000';
  const CANVAS_SIZE = 400;
  const CELL        = 20;
  const GRID        = CANVAS_SIZE / CELL;

  // ── STATE ────────────────────────────────────────────────────────────────
  const canvas = document.getElementById('gameCanvas');
  const ctx    = canvas.getContext('2d');

  let snake, dir, nextDir, food, score, bestScore, running, speedTimer;

  bestScore = parseInt(localStorage.getItem('snakeBest') || '0');
  document.getElementById('best-display').textContent = bestScore;

  function initState() {
    snake   = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir     = {x:1,y:0};
    nextDir = {x:1,y:0};
    score   = 0;
    running = false;
    document.getElementById('score-display').textContent = '0';
    spawnFood();
  }

  function spawnFood() {
    let p;
    do { p = { x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID) }; }
    while (snake.some(s => s.x===p.x && s.y===p.y));
    food = p;
  }

  // ── DRAW ─────────────────────────────────────────────────────────────────
  function draw() {
    ctx.fillStyle = '#090d13';
    ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);

    // grid dots
    ctx.fillStyle = 'rgba(255,255,255,0.028)';
    for (let x=0;x<GRID;x++) for (let y=0;y<GRID;y++)
      ctx.fillRect(x*CELL+9, y*CELL+9, 2, 2);

    // food
    ctx.save();
    ctx.shadowColor = '#f05454'; ctx.shadowBlur = 14;
    ctx.fillStyle   = '#f05454';
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    // food shine
    ctx.fillStyle = 'rgba(255,175,175,0.3)';
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2-2, food.y*CELL+CELL/2-2, CELL/2-7, 0, Math.PI*2);
    ctx.fill();

    // snake
    snake.forEach((seg,i) => {
      const sx=seg.x*CELL, sy=seg.y*CELL;
      const t = 1-(i/snake.length)*0.55;
      ctx.save();
      if (i===0) { ctx.shadowColor='#3ddc6e'; ctx.shadowBlur=10; ctx.fillStyle='#3ddc6e'; }
      else { ctx.fillStyle=`rgba(45,${Math.round(200*t)},75,${t})`; }
      ctx.beginPath();
      ctx.roundRect(sx+2,sy+2,CELL-4,CELL-4,4);
      ctx.fill();
      ctx.restore();

      if (i===0) {
        ctx.fillStyle='#090d13';
        let e=[];
        if      (dir.x===1)  e=[[sx+13,sy+4],[sx+13,sy+12]];
        else if (dir.x===-1) e=[[sx+3,sy+4],[sx+3,sy+12]];
        else if (dir.y===-1) e=[[sx+4,sy+3],[sx+12,sy+3]];
        else                 e=[[sx+4,sy+13],[sx+12,sy+13]];
        e.forEach(([ex,ey])=>ctx.fillRect(ex,ey,3,3));
      }
    });
  }

  // ── LOOP ─────────────────────────────────────────────────────────────────
  function tick() {
    dir = {...nextDir};
    const h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};

    if (h.x<0||h.x>=GRID||h.y<0||h.y>=GRID) { endGame(); return; }
    if (snake.some(s=>s.x===h.x&&s.y===h.y))  { endGame(); return; }

    snake.unshift(h);
    if (h.x===food.x && h.y===food.y) {
      score++;
      document.getElementById('score-display').textContent = score;
      if (score>bestScore) {
        bestScore=score;
        localStorage.setItem('snakeBest',bestScore);
        document.getElementById('best-display').textContent = bestScore;
      }
      spawnFood();
    } else { snake.pop(); }
    draw();
  }

  function speed() {
    if (score<5)  return 150;
    if (score<10) return 120;
    if (score<20) return 95;
    if (score<35) return 75;
    return 60;
  }

  function schedule() {
    if (!running) return;
    speedTimer = setTimeout(()=>{ tick(); schedule(); }, speed());
  }

  function startGame() {
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('gameover-card').classList.remove('show');
    initState(); running=true;
    clearTimeout(speedTimer);
    schedule(); draw();
  }

  function endGame() {
    running=false; clearTimeout(speedTimer);
    document.getElementById('final-score-val').textContent = score;
    document.getElementById('player-name').value           = '';
    document.getElementById('submit-btn').disabled         = false;
    const s=document.getElementById('submit-status');
    s.textContent=''; s.className='';
    document.getElementById('gameover-card').classList.add('show');
    setTimeout(()=>document.getElementById('player-name').focus(),120);
  }

  // ── CONTROLS ─────────────────────────────────────────────────────────────
  const KEYS = {
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, W:{x:0,y:-1}, s:{x:0,y:1}, S:{x:0,y:1},
    a:{x:-1,y:0}, A:{x:-1,y:0}, d:{x:1,y:0}, D:{x:1,y:0},
  };

  document.addEventListener('keydown', e=>{
    const m=KEYS[e.key]; if (!m) return;
    if (e.key.startsWith('Arrow')) e.preventDefault();
    if (m.x!==0&&m.x===-dir.x) return;
    if (m.y!==0&&m.y===-dir.y) return;
    nextDir=m;
  });

  // ── SUBMIT SCORE ─────────────────────────────────────────────────────────
  async function submitScore() {
    const inp=document.getElementById('player-name');
    const name=inp.value.trim();
    const st=document.getElementById('submit-status');
    const btn=document.getElementById('submit-btn');

    if (!name) {
      st.className='err'; st.textContent='⚠ Please enter your name first.';
      inp.focus(); return;
    }

    btn.disabled=true;
    st.className=''; st.textContent='Submitting…';

    try {
      const r=await fetch(`${API_BASE}/scores`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name,score}),
      });
      if (!r.ok) throw new Error(`Server ${r.status}`);
      st.className='ok'; st.textContent='✓ Score saved to leaderboard!';
      fetchLeaderboard();
    } catch(e) {
      st.className='err'; st.textContent=`✕ Failed to save. (${e.message})`;
      btn.disabled=false;
    }
  }

  document.getElementById('player-name').addEventListener('keydown',e=>{
    if (e.key==='Enter') submitScore();
  });

  // ── LEADERBOARD ───────────────────────────────────────────────────────────
  async function fetchLeaderboard() {
    const tbody=document.getElementById('lb-body');
    try {
      const r=await fetch(`${API_BASE}/scores`);
      if (!r.ok) throw new Error(r.status);
      const data=await r.json();

      if (!data.length) {
        tbody.innerHTML=`<tr><td colspan="4"><div class="lb-msg">
          <span class="lb-msg-icon">🎮</span>No scores yet. Be the first!
        </div></td></tr>`;
        return;
      }

      const M=['🥇','🥈','🥉'];
      tbody.innerHTML=data.map((s,i)=>{
        const d=new Date(s.date);
        const ds=isNaN(d)?'—':d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
        return `<tr class="${i<3?`rank-${i+1}`:''}">
          <td><span class="rank-chip">${M[i]||`#${i+1}`}</span></td>
          <td class="name-col">${esc(s.name)}</td>
          <td class="score-col">${s.score}</td>
          <td class="date-col">${ds}</td>
        </tr>`;
      }).join('');
    } catch {
      tbody.innerHTML=`<tr><td colspan="4"><div class="lb-msg err">
        ⚠ Backend unreachable. Is the server running?
      </div></td></tr>`;
    }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── INIT ─────────────────────────────────────────────────────────────────
  initState(); draw();
  fetchLeaderboard();
  setInterval(fetchLeaderboard, 30000);
</script>
</body>
</html>
