<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
    }

    h1 {
      font-size: 2.4rem;
      color: #4cef6c;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 0 12px #4cef6c88;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .game-wrapper {
      position: relative;
      display: inline-block;
    }

    canvas {
      display: block;
      border: 2px solid #4cef6c44;
      border-radius: 4px;
      box-shadow: 0 0 30px #4cef6c22;
      background: #111;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 400px;
      margin-bottom: 10px;
    }

    .hud-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 20px;
      text-align: center;
    }

    .hud-label {
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #4cef6c;
    }

    .controls-hint {
      font-size: 0.72rem;
      color: #444;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* Overlay */
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 400px; height: 400px;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      gap: 14px;
    }

    #overlay.hidden { display: none; }

    #overlay h2 {
      font-size: 1.8rem;
      color: #ef4c4c;
      text-shadow: 0 0 10px #ef4c4c88;
      letter-spacing: 3px;
    }

    #overlay .final-score {
      font-size: 1rem;
      color: #aaa;
    }

    #overlay .final-score span {
      color: #4cef6c;
      font-weight: bold;
      font-size: 1.2rem;
    }

    #overlay input {
      background: #1e1e1e;
      border: 1px solid #4cef6c66;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 1rem;
      padding: 10px 16px;
      width: 200px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    #overlay input:focus { border-color: #4cef6c; }
    #overlay input::placeholder { color: #444; }

    .btn {
      background: #4cef6c;
      color: #0d0d0d;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 10px 28px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #6fff88; transform: scale(1.03); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: transparent;
      color: #4cef6c;
      border: 1px solid #4cef6c66;
    }

    .btn-secondary:hover { background: #4cef6c11; }

    #start-overlay h2 { color: #4cef6c; text-shadow: 0 0 10px #4cef6c88; }

    /* Leaderboard */
    .leaderboard {
      width: 400px;
      margin-top: 30px;
    }

    .leaderboard h2 {
      font-size: 1rem;
      color: #4cef6c;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: center;
    }

    #leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }

    #leaderboard-table th {
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 12px;
      text-align: left;
      border-bottom: 1px solid #222;
    }

    #leaderboard-table td {
      padding: 10px 12px;
      font-size: 0.9rem;
      border-bottom: 1px solid #1a1a1a;
    }

    #leaderboard-table tr:hover td { background: #161616; }

    .rank-1 td:first-child { color: #ffd700; }
    .rank-2 td:first-child { color: #c0c0c0; }
    .rank-3 td:first-child { color: #cd7f32; }

    .score-col { color: #4cef6c; font-weight: bold; text-align: right; }
    .date-col { color: #444; font-size: 0.75rem; text-align: right; }

    #lb-status {
      text-align: center;
      color: #444;
      font-size: 0.8rem;
      padding: 16px;
    }

    .refresh-btn {
      display: block;
      margin: 12px auto 0;
      background: transparent;
      color: #444;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      font-size: 0.75rem;
      padding: 6px 16px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .refresh-btn:hover { color: #4cef6c; border-color: #4cef6c44; }

    .submit-status {
      font-size: 0.8rem;
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🐍 Snake</h1>
  <p class="subtitle">Use arrow keys to play</p>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score-display">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Best</div>
      <div class="hud-value" id="best-display">0</div>
    </div>
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Start overlay -->
    <div id="start-overlay" id="overlay">
      <h2>SNAKE</h2>
      <p style="color:#666;font-size:0.85rem;text-align:center;">Classic arcade game.<br>Eat food, grow longer, don't crash.</p>
      <button class="btn" onclick="startGame()">▶ START GAME</button>
    </div>

    <!-- Game Over overlay -->
    <div id="gameover-overlay" class="hidden" style="position:absolute;top:0;left:0;width:400px;height:400px;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;gap:14px;">
      <h2 style="font-size:1.8rem;color:#ef4c4c;text-shadow:0 0 10px #ef4c4c88;letter-spacing:3px;">GAME OVER</h2>
      <div class="final-score">Final Score: <span id="final-score-val">0</span></div>
      <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />
      <div class="submit-status" id="submit-status"></div>
      <div style="display:flex;gap:10px;">
        <button class="btn" id="submit-btn" onclick="submitScore()">Submit Score</button>
        <button class="btn btn-secondary" onclick="startGame()">Play Again</button>
      </div>
    </div>
  </div>

  <p class="controls-hint">↑ ↓ ← → to move &nbsp;|&nbsp; Eat the red food &nbsp;|&nbsp; Don't hit walls or yourself</p>

  <!-- Leaderboard -->
  <div class="leaderboard">
    <h2>🏆 Leaderboard</h2>
    <table id="leaderboard-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th class="score-col">Score</th>
          <th class="date-col">Date</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4"><div id="lb-status">Loading scores...</div></td></tr>
      </tbody>
    </table>
    <button class="refresh-btn" onclick="fetchLeaderboard()">↻ Refresh</button>
  </div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────────────────────
    const API_BASE = 'http://localhost:5000';
    const CANVAS_SIZE = 400;
    const CELL = 20;
    const GRID = CANVAS_SIZE / CELL; // 20

    // ─── GAME STATE ───────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let snake, dir, nextDir, food, score, bestScore, gameLoop, running;

    bestScore = parseInt(localStorage.getItem('snakeBest') || '0');
    document.getElementById('best-display').textContent = bestScore;

    function initState() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir     = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score   = 0;
      running = false;
      document.getElementById('score-display').textContent = '0';
      spawnFood();
    }

    function spawnFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    // ─── DRAWING ──────────────────────────────────────────────────────────────
    function draw() {
      // Background
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // Grid dots
      ctx.fillStyle = '#1a1a1a';
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          ctx.fillRect(x * CELL + 9, y * CELL + 9, 2, 2);
        }
      }

      // Food
      const fx = food.x * CELL, fy = food.y * CELL;
      ctx.fillStyle = '#ef4c4c';
      ctx.shadowColor = '#ef4c4c';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(fx + CELL / 2, fy + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        const sx = seg.x * CELL, sy = seg.y * CELL;
        const ratio = 1 - (i / snake.length) * 0.5;
        ctx.fillStyle = i === 0
          ? '#4cef6c'
          : `rgba(76, ${Math.round(239 * ratio)}, 108, ${ratio})`;
        if (i === 0) {
          ctx.shadowColor = '#4cef6c';
          ctx.shadowBlur = 8;
        }
        ctx.beginPath();
        ctx.roundRect(sx + 1, sy + 1, CELL - 2, CELL - 2, 3);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Eyes on head
        if (i === 0) {
          ctx.fillStyle = '#0d0d0d';
          const ex = dir.x === 0 ? [4, 12] : dir.x > 0 ? [14, 14] : [4, 4];
          const ey = dir.y === 0 ? [4, 4]  : dir.y > 0 ? [14, 14] : [4, 4];
          const eyOff = dir.x !== 0 ? [4, 12] : [4, 4];
          // simple eyes
          ctx.fillRect(sx + ex[0], sy + eyOff[0], 3, 3);
          ctx.fillRect(sx + ex[1], sy + eyOff[1], 3, 3);
        }
      });
    }

    // ─── GAME LOOP ────────────────────────────────────────────────────────────
    function tick() {
      dir = { ...nextDir };

      const head = {
        x: (snake[0].x + dir.x + GRID) % GRID,
        y: (snake[0].y + dir.y + GRID) % GRID,
      };

      // Wall collision (no wrap — hard walls)
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame(); return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score-display').textContent = score;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('snakeBest', bestScore);
          document.getElementById('best-display').textContent = bestScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    // Override tick to use hard walls
    function tickHardWalls() {
      dir = { ...nextDir };

      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y,
      };

      // Wall collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame(); return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score-display').textContent = score;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('snakeBest', bestScore);
          document.getElementById('best-display').textContent = bestScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function getSpeed() {
      if (score < 5)  return 150;
      if (score < 10) return 120;
      if (score < 20) return 95;
      if (score < 35) return 75;
      return 60;
    }

    let speedTimer = null;

    function scheduleNext() {
      if (!running) return;
      speedTimer = setTimeout(() => {
        tickHardWalls();
        scheduleNext();
      }, getSpeed());
    }

    function startGame() {
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('gameover-overlay').style.display = 'none';
      initState();
      running = true;
      if (speedTimer) clearTimeout(speedTimer);
      scheduleNext();
      draw();
    }

    function endGame() {
      running = false;
      clearTimeout(speedTimer);
      document.getElementById('final-score-val').textContent = score;
      document.getElementById('player-name').value = '';
      document.getElementById('submit-status').textContent = '';
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('gameover-overlay').style.display = 'flex';
    }

    // ─── CONTROLS ─────────────────────────────────────────────────────────────
    const keyMap = {
      ArrowUp:    { x: 0,  y: -1 },
      ArrowDown:  { x: 0,  y:  1 },
      ArrowLeft:  { x: -1, y:  0 },
      ArrowRight: { x: 1,  y:  0 },
      w: { x: 0,  y: -1 },
      s: { x: 0,  y:  1 },
      a: { x: -1, y:  0 },
      d: { x: 1,  y:  0 },
    };

    document.addEventListener('keydown', e => {
      const mapped = keyMap[e.key];
      if (!mapped) return;
      e.preventDefault();
      // Prevent reversing direction
      if (mapped.x !== 0 && mapped.x === -dir.x) return;
      if (mapped.y !== 0 && mapped.y === -dir.y) return;
      nextDir = mapped;
    });

    // ─── SCORE SUBMISSION ─────────────────────────────────────────────────────
    async function submitScore() {
      const nameInput = document.getElementById('player-name');
      const name = nameInput.value.trim();
      const statusEl = document.getElementById('submit-status');
      const btn = document.getElementById('submit-btn');

      if (!name) {
        statusEl.style.color = '#ef4c4c';
        statusEl.textContent = 'Please enter your name.';
        nameInput.focus();
        return;
      }

      btn.disabled = true;
      statusEl.style.color = '#888';
      statusEl.textContent = 'Submitting...';

      try {
        const res = await fetch(`${API_BASE}/scores`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, score }),
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        statusEl.style.color = '#4cef6c';
        statusEl.textContent = '✓ Score submitted!';
        fetchLeaderboard();
      } catch (err) {
        statusEl.style.color = '#ef4c4c';
        statusEl.textContent = `Failed to submit. (${err.message})`;
        btn.disabled = false;
      }
    }

    // Enter key submits
    document.getElementById('player-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitScore();
    });

    // ─── LEADERBOARD ──────────────────────────────────────────────────────────
    async function fetchLeaderboard() {
      const tbody = document.getElementById('leaderboard-body');
      const status = document.getElementById('lb-status');

      try {
        const res = await fetch(`${API_BASE}/scores`);
        if (!res.ok) throw new Error(`${res.status}`);
        const scores = await res.json();

        if (!scores.length) {
          tbody.innerHTML = '<tr><td colspan="4"><div id="lb-status" style="text-align:center;color:#444;font-size:0.8rem;padding:16px;">No scores yet. Be the first!</div></td></tr>';
          return;
        }

        const medals = ['🥇', '🥈', '🥉'];
        tbody.innerHTML = scores.map((s, i) => {
          const d = new Date(s.date);
          const dateStr = isNaN(d) ? '—' : d.toLocaleDateString();
          const rankClass = i < 3 ? `rank-${i+1}` : '';
          const rank = medals[i] || `#${i+1}`;
          return `
            <tr class="${rankClass}">
              <td>${rank}</td>
              <td>${escapeHtml(s.name)}</td>
              <td class="score-col">${s.score}</td>
              <td class="date-col">${dateStr}</td>
            </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4"><div id="lb-status" style="text-align:center;color:#555;font-size:0.8rem;padding:16px;">Could not load scores. Is the backend running?</div></td></tr>`;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    initState();
    draw();
    fetchLeaderboard();
    // Auto-refresh leaderboard every 30s
    setInterval(fetchLeaderboard, 30000);
  </script>
</body>
</html>
